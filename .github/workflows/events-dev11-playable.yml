name: Events Dev17 full portable test build

on:
  push:
    branches:
      - develop/v1.2.3.1-odin-missions
  workflow_dispatch:

jobs:
  build-events-test:
    runs-on: windows-latest
    steps:
      - name: Check out events development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Validate Python, launcher and native source
        shell: pwsh
        run: |
          python -m compileall -q Payload Tools
          python .\Payload\verify_release.py --source-only
          python -m unittest Tools.test_v1231_dev3_deaths_thrashers_blink Tools.test_v1231_dev4_settings_mutations_mercs Tools.test_v1231_dev5_kerrigan_vortex Tools.test_v1231_dev6_events_framework Tools.test_v1231_dev8_events Tools.test_v1231_dev11_mechanical_events Tools.test_v1231_dev14_galaxy_and_assets Tools.test_v1231_dev15_events_and_updater Tools.test_v1231_dev16_event_handshake
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\Tools\Update-ExistingSlay.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw 'In-place updater contains PowerShell syntax errors'
          }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\Tools\Install-Slay-From-Downloads.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw 'Downloads updater contains PowerShell syntax errors'
          }

      - name: Build portable Windows launcher
        shell: pwsh
        run: .\Tools\build_launcher.ps1

      - name: Assemble Dev17 event test folder
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'Slay the StarCraft Events Dev17'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force .\Payload (Join-Path $stage 'Payload')
          Copy-Item -Recurse -Force .\Tools (Join-Path $stage 'Tools')
          if (Test-Path .\Config) { Copy-Item -Recurse -Force .\Config (Join-Path $stage 'Config') }
          if (-not (Test-Path .\SlayTheStarCraft.exe)) {
            throw 'The launcher build did not produce SlayTheStarCraft.exe'
          }
          Copy-Item -Force .\SlayTheStarCraft.exe (Join-Path $stage 'SlayTheStarCraft.exe')
          foreach ($file in @('VERSION.txt','launcher_manifest.json','README.txt','README.md','CHANGELOG.md','CONTRIBUTING.md','EVENTS_DEV11_TESTING.md','EVENTS_DEV12_TESTING.md','EVENTS_DEV13_TESTING.md','EVENTS_DEV14_TESTING.md','EVENTS_DEV15_TESTING.md','EVENTS_DEV16_TESTING.md')) {
            if (Test-Path $file) { Copy-Item -Force $file (Join-Path $stage $file) }
          }
          Get-ChildItem -Path $stage -Recurse -Directory -Filter '__pycache__' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $stage -Recurse -File -Include '*.pyc','*.pyo' | Remove-Item -Force -ErrorAction SilentlyContinue
          'integration_branch=develop/v1.2.3.1-odin-missions' | Set-Content -Encoding UTF8 (Join-Path $stage 'INTEGRATION_BUILD.txt')
          "build_type=events-dev17-untested" | Add-Content -Encoding UTF8 (Join-Path $stage 'INTEGRATION_BUILD.txt')
          "commit=$env:GITHUB_SHA" | Add-Content -Encoding UTF8 (Join-Path $stage 'INTEGRATION_BUILD.txt')

      - name: Upload playable Events Dev17 full test build
        uses: actions/upload-artifact@v4
        with:
          name: slay-the-starcraft-events-dev17-full-windows
          path: ${{ runner.temp }}/Slay the StarCraft Events Dev17/
          if-no-files-found: error
          retention-days: 14
